<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi Select Dropdown with Limit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .selected-item {
      background-color: #6f42c1;
      color: #fff;
      padding: 4px 10px;
      border-radius: 4px;
      margin-right: 5px;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
    }
    .remove-icon {
      margin-left: 6px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body class="p-4">

  <div class="dropdown">
    <button id="dropdownButton" class="btn btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
      Select Options
    </button>
    <ul class="dropdown-menu">
      <li><a class="dropdown-item" href="#" data-value="Option 1">Option 1</a></li>
      <li><a class="dropdown-item" href="#" data-value="Option 2">Option 2</a></li>
      <li><a class="dropdown-item" href="#" data-value="Option 3">Option 3</a></li>
      <li><a class="dropdown-item" href="#" data-value="Option 4">Option 4</a></li>
      <li><a class="dropdown-item" href="#" data-value="Option 5">Option 5</a></li>
    </ul>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const dropdownButton = document.getElementById("dropdownButton");
    const items = document.querySelectorAll(".dropdown-item");
    let selectedValues = [];
    const maxSelections = 3;

    function renderSelected() {
      if (selectedValues.length > 0) {
        dropdownButton.innerHTML = selectedValues.map(v => `
          <span class="selected-item">
            ${v} <span class="remove-icon" data-value="${v}">&times;</span>
          </span>
        `).join(" ");
      } else {
        dropdownButton.textContent = "Select Options";
      }

      document.querySelectorAll(".remove-icon").forEach(icon => {
        icon.addEventListener("click", (e) => {
          e.stopPropagation();
          e.preventDefault();
          const value = e.target.getAttribute("data-value");
          selectedValues = selectedValues.filter(v => v !== value);
          renderSelected();

          const dropdown = bootstrap.Dropdown.getOrCreateInstance(dropdownButton);
          dropdown.hide();
        });
      });
    }

    items.forEach(item => {
      item.addEventListener("click", (e) => {
        e.preventDefault();
        const value = item.getAttribute("data-value");

        if (!selectedValues.includes(value)) {
          if (selectedValues.length >= maxSelections) {
            return;
          }
          selectedValues.push(value);
        } else {
          selectedValues = selectedValues.filter(v => v !== value);
        }

        renderSelected();
      });
    });
  </script>
</body>
</html>
